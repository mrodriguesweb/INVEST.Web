name: Build and Deploy Function App

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./azure/functions/Company.Functions/Company.Functions.csproj

      - name: Build
        run: dotnet build ./azure/functions/Company.Functions/Company.Functions.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./azure/functions/Company.Functions/Company.Functions.csproj --configuration Release --output ./publish

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: fa-azure-default
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
